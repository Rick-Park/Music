<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gibberlinks</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 360px;
      background: #1c1c1c;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      text-align: center;
    }

    .cover {
      width: 100%;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 8px;
    }

    p {
      color: #bbb;
      margin: 0 0 20px;
    }

    audio {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="cover.jpg" alt="Album Cover" class="cover">
    <h1>Gibberlinks</h1>
    <p>Rick Park</p>
    <audio controls>
      <source src="gibberlinks.mp3" type="audio/mpeg">
      브라우저가 오디오를 지원하지 않습니다.
    </audio>
  </div>
</body>
</html>
